<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Cluely Pill</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <div id="pill" class="pill" style="-webkit-app-region: drag;">
      <div class="pill-left" style="-webkit-app-region: no-drag;">
        <button id="logo-btn" class="logo-btn" type="button" aria-label="Cluely"></button>
      </div>
      <div class="pill-body" style="-webkit-app-region: no-drag;">
        <button id="listen-btn" class="listen-btn" type="button" aria-label="Listen">
          <span class="listen-icon"></span>
          <span>Listen</span>
        </button>
        <div class="pill-separator"></div>
        <div class="input-wrapper">
          <span class="input-icon">T</span>
          <input id="prompt-input" type="text" placeholder="Ask question" autocomplete="off" spellcheck="false" />
        </div>
      </div>
      <div class="pill-right" style="-webkit-app-region: no-drag;">
        <button id="incognito-btn" class="icon-btn" type="button" aria-label="Toggle incognito">
          <span class="icon-eye"></span>
        </button>
        <div class="pill-divider"></div>
        <button id="menu-btn" class="icon-btn" type="button" aria-label="More options">
          <span class="icon-dots"></span>
        </button>
      </div>
    </div>

    <div id="toast-container" class="toast-container" style="-webkit-app-region: no-drag;"></div>

    <div id="outputs" class="outputs" style="-webkit-app-region: no-drag;" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
